<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <title>Tonirovka.md — tonare auto premium</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Tonare geamuri auto, folie atermică și tonare faruri. Folii premium, garanție până la 10 ani."
    />
    <meta name="author" content="Tonirovka.md" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons (generated from the logo mark, see src/assets/icons/app) -->
    <link href="favicon.ico" rel="icon" sizes="48x48" />
    <link href="assets/icons/app/icon.svg" rel="icon" type="image/svg+xml" />
    <link href="assets/icons/app/icon-32.png" rel="icon" type="image/png" sizes="32x32" />
    <link href="assets/icons/app/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
    <link href="site.webmanifest" rel="manifest" />
    <meta name="apple-mobile-web-app-title" content="Tonirovka.md" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Per-page SEO tags (canonical, hreflang, Open Graph, JSON-LD) are added to each page's
         HTML by scripts/seo-pages.ts after the build, and kept up to date by SeoService. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Boot screen styles: shown until Angular starts and renders the page. -->
    <style>
      body {
        margin: 0;
        background: #050505;
        color: #b4b4be;
        font-family: Manrope, system-ui, sans-serif;
      }
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem 1rem;
        text-align: center;
        box-sizing: border-box;
        background: radial-gradient(60% 50% at 50% 40%, rgba(225, 29, 42, 0.22), transparent 70%);
      }
      .boot__logo {
        margin: 0;
        font:
          700 1.25rem Unbounded,
          system-ui,
          sans-serif;

        color: #fff;
      }
      .boot__logo b {
        color: #ef2633;
      }
      .boot h1 {
        margin: 0;
        max-width: 40rem;
        font:
          700 clamp(1.6rem, 5vw, 2.6rem)/1.15 Unbounded,
          system-ui,
          sans-serif;
        color: #fff;
      }
      .boot p {
        margin: 0;
        max-width: 36rem;
        line-height: 1.6;
      }
      .boot nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.25rem 1rem;
        font-size: 0.875rem;
      }
      .boot nav a {
        color: #8a8a96;
        text-decoration: none;
      }
      .boot__spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #2e2e36;
        border-top-color: #e11d2a;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="boot" role="status">
        <p class="boot__logo">TONIROVKA<b>.MD</b></p>
        <span class="boot__spinner" aria-hidden="true"></span>
      </div>
    </app-root>
  </body>
</html>

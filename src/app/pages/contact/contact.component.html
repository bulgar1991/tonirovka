@let t = i18n.t();
@let c = t.contacts;
<app-page-header [title]="c.h1" [subtitle]="c.intro" />

<section class="mt-12 sm:mt-16" data-testid="contact-info">
  <div class="container-site grid gap-6 lg:grid-cols-[1fr_1.4fr]">
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-1">
      <a
        [href]="mapLink"
        target="_blank"
        rel="noopener"
        class="card group flex gap-4 p-6 transition hover:border-brand-600/60"
        data-testid="contact-address"
      >
        <span
          class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-brand-600/15 text-brand-400"
          ><app-icon name="pin"
        /></span>
        <span>
          <span class="block text-sm text-ink-400">{{ c.address }}</span>
          <span class="mt-1 block font-semibold text-white group-hover:text-brand-400"
            >{{ address.street }}, {{ address.city }}</span
          >
        </span>
      </a>
      <a
        [href]="phoneHref"
        class="card group flex gap-4 p-6 transition hover:border-brand-600/60"
        data-testid="contact-phone"
      >
        <span
          class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-brand-600/15 text-brand-400"
          ><app-icon name="phone"
        /></span>
        <span>
          <span class="block text-sm text-ink-400">{{ c.phone }}</span>
          <span
            class="mt-1 block font-display text-lg font-bold text-white group-hover:text-brand-400"
            >{{ phone }}</span
          >
        </span>
      </a>
      <a
        [href]="emailHref"
        class="card group flex gap-4 p-6 transition hover:border-brand-600/60"
        data-testid="contact-email"
      >
        <span
          class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-brand-600/15 text-brand-400"
          ><app-icon name="mail"
        /></span>
        <span>
          <span class="block text-sm text-ink-400">{{ c.email }}</span>
          <span class="mt-1 block font-semibold text-white group-hover:text-brand-400">{{
            email
          }}</span>
        </span>
      </a>
      <div class="card flex gap-4 p-6" data-testid="contact-hours">
        <span
          class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-brand-600/15 text-brand-400"
          ><app-icon name="clock"
        /></span>
        <div class="text-sm">
          <span class="block text-ink-400">{{ c.hours }}</span>
          <app-opening-hours class="mt-1 block text-white" />
        </div>
      </div>
      <div class="grid grid-cols-3 gap-3 sm:col-span-2 lg:col-span-1">
        @for (m of messengers; track m.id) {
          <a
            [href]="m.href"
            [attr.target]="m.id === 'viber' ? null : '_blank'"
            rel="noopener"
            class="card group flex flex-col items-center gap-2 p-4 text-sm font-semibold text-white transition hover:-translate-y-0.5 hover:border-ink-500"
            [attr.data-testid]="'contact-' + m.id"
          >
            <span
              class="grid h-12 w-12 place-items-center rounded-full text-white shadow-lg transition group-hover:brightness-110"
              [style.background-color]="m.color"
            >
              <app-brand-icon [name]="m.id" [size]="26" />
            </span>
            {{ m.name }}
          </a>
        }
      </div>
    </div>

    <div
      data-testid="contact-map"
      class="relative min-h-[360px] overflow-hidden rounded-2xl border border-ink-700 bg-ink-900"
    >
      <!-- The map is a static picture: no dragging or zooming. A click opens Google Maps. -->
      <iframe
        [src]="mapEmbed"
        [title]="c.mapTitle"
        class="pointer-events-none h-full min-h-[360px] w-full grayscale invert-[0.92] hue-rotate-180"
        loading="lazy"
        tabindex="-1"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
      <a
        [href]="mapLink"
        target="_blank"
        rel="noopener"
        class="group absolute inset-0 flex items-start justify-start p-4"
        [attr.aria-label]="c.mapOpen"
        data-testid="contact-map-link"
      >
        <span
          class="flex items-center gap-2 rounded-full bg-ink-950/85 px-4 py-2 text-sm font-semibold text-white shadow-lg backdrop-blur transition group-hover:bg-brand-600"
        >
          <app-icon name="pin" [size]="16" />{{ c.mapOpen }}
        </span>
      </a>
      <!-- Our logo as the map pin: the map is centred on the studio, so the tip marks it. -->
      <div
        class="pointer-events-none absolute left-1/2 top-1/2 flex -translate-x-1/2 -translate-y-full flex-col items-center drop-shadow-[0_8px_16px_rgba(0,0,0,0.6)]"
        aria-hidden="true"
      >
        <img
          src="assets/images/logo/logo.svg"
          alt=""
          width="72"
          height="72"
          class="h-[72px] w-[72px] rounded-full ring-4 ring-brand-600"
        />
        <span
          class="-mt-1 h-0 w-0 border-x-[10px] border-t-[14px] border-x-transparent border-t-brand-600"
        ></span>
      </div>
    </div>
  </div>
</section>

<section
  class="section-band border-y border-ink-800 bg-ink-900/50"
  id="booking"
  data-testid="contact-booking"
>
  <div class="container-site grid gap-10 lg:grid-cols-[1fr_1.5fr]">
    <div>
      <h2 class="h2 mt-0">{{ t.booking.title }}</h2>
      <p class="lead">{{ t.booking.text }}</p>
    </div>
    <div class="card p-6 sm:p-8">
      <app-booking-form />
    </div>
  </div>
</section>

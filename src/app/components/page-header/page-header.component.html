<section
  class="relative overflow-hidden pt-32 sm:pt-40"
  [class]="image() ? 'lg:pt-48' : ''"
  data-testid="page-header"
>
  @if (image(); as image) {
    <img
      [src]="image"
      alt=""
      fetchpriority="high"
      class="absolute inset-0 h-full w-full animate-fade-in object-cover"
    />
    <div class="absolute inset-0 bg-gradient-to-r from-ink-950 via-ink-950/70 to-ink-950/10"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-ink-950 via-transparent to-ink-950/60"></div>
  } @else {
    <div class="red-glow pointer-events-none absolute inset-0"></div>
    <div class="grid-lines pointer-events-none absolute inset-0"></div>
  }
  <ng-content select="[backdrop]" />

  <div class="container-site relative">
    <nav class="text-sm text-ink-400" [attr.aria-label]="i18n.t().common.breadcrumb">
      <ol class="flex flex-wrap items-center gap-2">
        <li>
          <a class="transition-colors hover:text-white" [routerLink]="i18n.link('home')">{{
            i18n.t().common.home
          }}</a>
        </li>
        @if (parent(); as parent) {
          <li aria-hidden="true" class="text-brand-500">/</li>
          <li>
            <a class="transition-colors hover:text-white" [routerLink]="parent.link">{{
              parent.label
            }}</a>
          </li>
        }
        <li aria-hidden="true" class="text-brand-500">/</li>
        <li class="text-ink-300" aria-current="page">{{ crumb() ?? title() }}</li>
      </ol>
    </nav>

    <h1
      class="mt-6 max-w-4xl animate-fade-up text-3xl font-bold leading-tight sm:text-5xl lg:text-6xl"
    >
      {{ title() }}
    </h1>
    @if (subtitle(); as subtitle) {
      <p class="lead animate-fade-up [animation-delay:150ms]">{{ subtitle }}</p>
    }
    <ng-content />
  </div>
</section>
